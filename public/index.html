<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Shushu Compiler - Code, Compile, Create</title>

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500&family=Inter:wght@400;500;600&display=swap"
        rel="stylesheet"
    >

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #3B82F6;
            --primary-hover: #2563EB;
            --primary-light: #DBEAFE;

            --success: #10B981;
            --success-hover: #059669;

            --danger: #EF4444;

            --text-primary-light: #1F2937;
            --text-secondary-light: #6B7280;

            --bg-light: #F5F5F5;
            --surface-light: #FFFFFF;
            --surface-alt-light: #F9F9F9;
            --border-light: #E0E0E0;

            --text-primary-dark: #E0E0E0;
            --text-secondary-dark: #999999;

            --bg-dark: #1A1A1A;
            --surface-dark: #2D2D2D;
            --surface-alt-dark: #252525;
            --border-dark: #404040;
        }

        body {
            font-family: "Inter", sans-serif;
            height: 100vh;
            display: flex;
            flex-direction: column;

            background-color: var(--bg-light);
            color: var(--text-primary-light);

            transition:
                background-color 0.3s,
                color 0.3s;
        }

        body.dark-mode {
            background-color: var(--bg-dark);
            color: var(--text-primary-dark);
        }

        /* ================= HEADER ================= */

        .header {
            padding: 16px;

            border-bottom: 0.5px solid var(--border-light);
            background-color: var(--surface-alt-light);
        }

        body.dark-mode .header {
            border-bottom-color: var(--border-dark);
            background-color: var(--surface-alt-dark);
        }

        .header-top {
            display: flex;
            align-items: center;
            justify-content: space-between;

            margin-bottom: 12px;
        }

        .header-title {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .logo {
            width: 36px;
            height: 36px;

            display: flex;
            align-items: center;
            justify-content: center;

            background:
                linear-gradient(
                    135deg,
                    #3B82F6,
                    #6366F1
                );

            border-radius: 8px;

            color: white;

            font-size: 18px;
            font-weight: 700;
        }

        .header-info h1 {
            font-size: 22px;
            font-weight: 600;

            color: #3B82F6;
        }

        .header-info p {
            margin-top: 2px;

            font-size: 11px;

            color: var(--text-secondary-light);
        }

        body.dark-mode .header-info h1 {
            color: #60A5FA;
        }

        body.dark-mode .header-info p {
            color: var(--text-secondary-dark);
        }

        .theme-toggle {
            padding: 8px 12px;

            background-color: var(--surface-light);

            border:
                0.5px solid var(--border-light);

            border-radius: 8px;

            cursor: pointer;

            font-size: 16px;
        }

        body.dark-mode .theme-toggle {
            background-color: var(--surface-dark);
            border-color: var(--border-dark);
        }

        /* ================= LANGUAGE TABS ================= */

        .language-tabs {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;

            max-height: 80px;

            overflow-y: auto;
        }

        .lang-btn {
            padding: 6px 12px;

            background-color: var(--surface-light);

            border:
                0.5px solid var(--border-light);

            border-radius: 8px;

            cursor: pointer;

            font-size: 11px;
            font-weight: 500;

            white-space: nowrap;

            color: var(--text-primary-light);
        }

        body.dark-mode .lang-btn {
            background-color: var(--surface-dark);
            border-color: var(--border-dark);

            color: var(--text-primary-dark);
        }

        .lang-btn.active {
            border: 2px solid var(--primary);

            background-color: var(--primary-light);

            color: var(--primary);
        }

        body.dark-mode .lang-btn.active {
            background-color:
                rgba(59, 130, 246, 0.15);
        }

        /* ================= MAIN LAYOUT ================= */

        .main-container {
            display: flex;
            flex: 1;

            gap: 12px;

            overflow: hidden;

            padding: 12px;
        }

        .editor-section {
            flex: 1;

            min-width: 0;

            display: flex;
            flex-direction: column;

            background-color: var(--surface-light);

            border:
                0.5px solid var(--border-light);

            border-radius: 12px;

            overflow: hidden;
        }

        body.dark-mode .editor-section {
            background-color: var(--surface-dark);
            border-color: var(--border-dark);
        }

        /* ================= SECTION HEADER ================= */

        .section-header {
            padding: 12px 16px;

            display: flex;
            align-items: center;
            justify-content: space-between;

            font-size: 13px;
            font-weight: 500;

            color: var(--text-secondary-light);

            border-bottom:
                0.5px solid var(--border-light);

            background-color: var(--surface-alt-light);
        }

        body.dark-mode .section-header {
            color: var(--text-secondary-dark);

            border-bottom-color: var(--border-dark);

            background-color: var(--surface-alt-dark);
        }

        /* ================= EDITOR BUTTONS ================= */

        .editor-buttons {
            display: flex;
            gap: 8px;
        }

        .icon-btn {
            padding: 4px 8px;

            background: none;

            border:
                0.5px solid var(--border-light);

            border-radius: 4px;

            cursor: pointer;

            font-size: 11px;

            color: var(--text-primary-light);
        }

        body.dark-mode .icon-btn {
            border-color: var(--border-dark);
            color: var(--text-primary-dark);
        }

        .icon-btn.danger {
            color: var(--danger);
        }

        /* ================= CODE EDITOR ================= */

        textarea {
            flex: 1;

            width: 100%;

            padding: 16px;

            border: none;
            outline: none;

            resize: none;

            font-family:
                "Fira Code",
                monospace;

            font-size: 13px;

            line-height: 1.6;

            background-color: var(--surface-light);

            color: var(--text-primary-light);
        }

        body.dark-mode textarea {
            background-color: var(--bg-dark);
            color: var(--text-primary-dark);
        }

        /* ================= RIGHT PANEL ================= */

        .right-panel {
            width: 300px;

            display: flex;
            flex-direction: column;

            gap: 12px;
        }

        /* ================= OUTPUT ================= */

        .output-section {
            flex: 1;

            min-height: 200px;

            display: flex;
            flex-direction: column;

            overflow: hidden;

            background-color: var(--surface-light);

            border:
                0.5px solid var(--border-light);

            border-radius: 12px;
        }

        body.dark-mode .output-section {
            background-color: var(--surface-dark);
            border-color: var(--border-dark);
        }

        .output-content {
            flex: 1;

            min-height: 0;

            padding: 12px;

            overflow: auto;

            font-family:
                "Fira Code",
                monospace;

            font-size: 12px;

            white-space: pre-wrap;

            word-break: break-word;

            color: var(--text-primary-light);

            background-color: var(--surface-alt-light);
        }

        body.dark-mode .output-content {
            background-color: var(--bg-dark);
            color: var(--text-primary-dark);
        }

        .output-content.error {
            color: var(--danger);
        }

        .output-content iframe {
            width: 100%;
            height: 100%;

            border: none;

            background-color: white;
        }

        /* ================= BUTTONS ================= */

        .button-group {
            display: flex;
            flex-direction: column;

            gap: 8px;
        }

        button {
            border: none;

            border-radius: 8px;

            cursor: pointer;

            font-family: inherit;

            font-size: 13px;
            font-weight: 500;

            transition: all 0.2s;
        }

        .btn-primary {
            padding: 10px;

            background-color: var(--primary);

            color: white;
        }

        .btn-primary:hover:not(:disabled) {
            background-color: var(--primary-hover);
        }

        .btn-primary:disabled {
            opacity: 0.6;

            cursor: not-allowed;
        }

        .btn-secondary {
            padding: 10px;

            background-color: var(--surface-light);

            border:
                0.5px solid var(--border-light);

            color: var(--text-primary-light);
        }

        body.dark-mode .btn-secondary {
            background-color: var(--surface-dark);

            border-color: var(--border-dark);

            color: var(--text-primary-dark);
        }

        .btn-success {
            width: 100%;

            padding: 8px;

            background-color: var(--success);

            color: white;
        }

        .btn-success:hover {
            background-color: var(--success-hover);
        }

        /* ================= CARDS ================= */

        .card {
            padding: 12px;

            background-color: var(--surface-light);

            border:
                0.5px solid var(--border-light);

            border-radius: 12px;
        }

        body.dark-mode .card {
            background-color: var(--surface-dark);
            border-color: var(--border-dark);
        }

        .card-title {
            margin-bottom: 8px;

            font-size: 12px;
            font-weight: 500;

            color: var(--text-secondary-light);
        }

        body.dark-mode .card-title {
            color: var(--text-secondary-dark);
        }

        /* ================= HIDDEN ================= */

        .hidden {
            display: none;
        }

        /* ================= INPUT ================= */

        input[type="text"] {
            width: 100%;

            padding: 8px;

            margin-bottom: 8px;

            border:
                0.5px solid var(--border-light);

            border-radius: 8px;

            background-color: var(--surface-alt-light);

            color: var(--text-primary-light);

            font-family: "Inter", sans-serif;

            font-size: 12px;
        }

        body.dark-mode input[type="text"] {
            background-color: var(--surface-alt-dark);

            border-color: var(--border-dark);

            color: var(--text-primary-dark);
        }

        /* ================= SAVED CODE ================= */

        .saved-list {
            max-height: 220px;

            overflow-y: auto;
        }

        .saved-item {
            display: flex;
            align-items: center;
            justify-content: space-between;

            gap: 10px;

            padding: 8px;

            margin-bottom: 6px;

            background-color: var(--surface-alt-light);

            border:
                0.5px solid var(--border-light);

            border-radius: 6px;
        }

        body.dark-mode .saved-item {
            background-color: var(--surface-alt-dark);
            border-color: var(--border-dark);
        }

        .saved-item-info {
            min-width: 0;

            flex: 1;
        }

        .saved-item-name {
            width: 100%;

            background: none;

            text-align: left;

            border: none;

            cursor: pointer;

            color: var(--primary);

            font-size: 12px;
            font-weight: 500;

            font-family: inherit;

            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .saved-item-lang {
            margin-top: 2px;

            font-size: 10px;

            color: var(--text-secondary-light);
        }

        body.dark-mode .saved-item-lang {
            color: var(--text-secondary-dark);
        }

        .delete-btn {
            padding: 4px;

            background: none;

            border: none;

            cursor: pointer;

            color: var(--danger);
        }

        /* ================= SCROLLBAR ================= */

        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }

        ::-webkit-scrollbar-track {
            background: transparent;
        }

        ::-webkit-scrollbar-thumb {
            background: var(--border-light);

            border-radius: 4px;
        }

        body.dark-mode ::-webkit-scrollbar-thumb {
            background: var(--border-dark);
        }

        /* ================= MOBILE ================= */

        @media (max-width: 800px) {
            body {
                height: auto;
                min-height: 100vh;
            }

            .main-container {
                flex-direction: column;

                overflow: visible;
            }

            .editor-section {
                min-height: 500px;
            }

            .right-panel {
                width: 100%;

                min-height: 500px;
            }

            .output-section {
                min-height: 300px;
            }
        }
    </style>
</head>

<body>

    <!-- ================= HEADER ================= -->

    <div class="header">

        <div class="header-top">

            <div class="header-title">

                <div class="logo">
                    S
                </div>

                <div class="header-info">

                    <h1>
                        Shushu Compiler
                    </h1>

                    <p>
                        Code, Compile, Create
                    </p>

                </div>

            </div>

            <button
                class="theme-toggle"
                id="themeToggle"
                title="Toggle dark mode"
            >
                🌙
            </button>

        </div>

        <div
            class="language-tabs"
            id="languageTabs"
        ></div>

    </div>

    <!-- ================= MAIN ================= -->

    <div class="main-container">

        <!-- CODE EDITOR -->

        <div class="editor-section">

            <div class="section-header">

                <span>
                    <i class="fas fa-code"></i>
                    Code Editor
                </span>

                <div class="editor-buttons">

                    <button
                        class="icon-btn"
                        id="templateBtn"
                        title="Insert template"
                    >
                        <i class="fas fa-file-code"></i>
                    </button>

                    <button
                        class="icon-btn danger"
                        id="clearBtn"
                        title="Clear code"
                    >
                        <i class="fas fa-trash"></i>
                    </button>

                </div>

            </div>

            <textarea
                id="codeEditor"
                placeholder="Write your code here..."
                spellcheck="false"
            ></textarea>

        </div>

        <!-- RIGHT PANEL -->

        <div class="right-panel">

            <!-- OUTPUT -->

            <div class="output-section">

                <div class="section-header">

                    <span>
                        <i class="fas fa-terminal"></i>
                        Output
                    </span>

                </div>

                <div
                    class="output-content"
                    id="output"
                >
Output will appear here
                </div>

            </div>

            <!-- ACTION BUTTONS -->

            <div class="button-group">

                <button
                    class="btn-primary"
                    id="runBtn"
                >
                    <i class="fas fa-play"></i>
                    Run Code
                </button>

                <button
                    class="btn-secondary"
                    id="downloadBtn"
                >
                    <i class="fas fa-download"></i>
                    Download
                </button>

            </div>

            <!-- SAVE CODE -->

            <div class="card">

                <p class="card-title">

                    <i class="fas fa-bookmark"></i>
                    Save Code

                </p>

                <input
                    type="text"
                    id="saveName"
                    placeholder="Name your snippet"
                >

                <button
                    class="btn-success"
                    id="saveBtn"
                >
                    <i class="fas fa-check"></i>
                    Save
                </button>

            </div>

            <!-- SAVED CODE -->

            <div
                class="card hidden"
                id="savedCodesCard"
            >

                <p class="card-title">

                    <i class="fas fa-history"></i>

                    Saved
                    (
                    <span id="saveCount">
                        0
                    </span>
                    )

                </p>

                <div
                    class="saved-list"
                    id="savedList"
                ></div>

            </div>

        </div>

    </div>

    <script>

        // ==============================
        // LANGUAGES
        // ==============================

        const languages = {

            html: {
                name: "HTML/CSS/JS"
            },

            python: {
                name: "Python"
            },

            java: {
                name: "Java"
            },

            cpp: {
                name: "C++"
            },

            c: {
                name: "C"
            },

            csharp: {
                name: "C#"
            },

            js: {
                name: "JavaScript"
            },

            php: {
                name: "PHP"
            },

            go: {
                name: "Go"
            },

            rust: {
                name: "Rust"
            },

            sql: {
                name: "SQL"
            }

        };


        // ==============================
        // CODE TEMPLATES
        // ==============================

        const templates = {

            html: `<!DOCTYPE html>
<html>
<head>
    <title>Hello</title>
    <style>
        body {
            font-family: Arial;
            margin: 20px;
        }
    </style>
</head>

<body>

    <h1>Hello World!</h1>

    <p>
        Welcome to Shushu Compiler
    </p>

</body>
</html>`,

            python: `print("Hello, World!")

x = 10
y = 20

print(x + y)`,

            java: `public class Main {

    public static void main(String[] args) {

        System.out.println("Hello, World!");

    }

}`,

            cpp: `#include <iostream>

using namespace std;

int main() {

    cout << "Hello, World!" << endl;

    return 0;

}`,

            c: `#include <stdio.h>

int main() {

    printf("Hello, World!\\n");

    return 0;

}`,

            csharp: `using System;

class Program {

    static void Main() {

        Console.WriteLine("Hello, World!");

    }

}`,

            js: `console.log("Hello, World!");

let x = 10;
let y = 20;

console.log(x + y);`,

            php: `<?php

echo "Hello, World!";

?>`,

            go: `package main

import "fmt"

func main() {

    fmt.Println("Hello, World!")

}`,

            rust: `fn main() {

    println!("Hello, World!");

}`,

            sql: `CREATE TABLE students (

    id INTEGER,
    name TEXT,
    age INTEGER

);

INSERT INTO students VALUES
(1, 'Saikiran', 22);

INSERT INTO students VALUES
(2, 'Shushu', 25);

SELECT * FROM students;`

        };


        // ==============================
        // APPLICATION STATE
        // ==============================

        let currentLanguage = "html";

        let savedCodes = [];

        let isDarkMode = false;


        // ==============================
        // DOM ELEMENTS
        // ==============================

        const DOM = {

            codeEditor:
                document.getElementById("codeEditor"),

            output:
                document.getElementById("output"),

            runBtn:
                document.getElementById("runBtn"),

            downloadBtn:
                document.getElementById("downloadBtn"),

            saveBtn:
                document.getElementById("saveBtn"),

            saveName:
                document.getElementById("saveName"),

            languageTabs:
                document.getElementById("languageTabs"),

            themeToggle:
                document.getElementById("themeToggle"),

            templateBtn:
                document.getElementById("templateBtn"),

            clearBtn:
                document.getElementById("clearBtn"),

            savedCodesCard:
                document.getElementById("savedCodesCard"),

            saveCount:
                document.getElementById("saveCount"),

            savedList:
                document.getElementById("savedList")

        };


        // ==============================
        // INITIALIZATION
        // ==============================

        function init() {

            loadDarkMode();

            loadSavedCodes();

            createLanguageTabs();

            setDefaultCode();

            attachEventListeners();

        }


        // ==============================
        // CREATE LANGUAGE BUTTONS
        // ==============================

        function createLanguageTabs() {

            Object.entries(languages).forEach(
                ([key, lang]) => {

                    const button =
                        document.createElement("button");

                    button.className =
                        "lang-btn";

                    button.textContent =
                        lang.name;

                    if (
                        key === currentLanguage
                    ) {

                        button.classList.add(
                            "active"
                        );

                    }

                    button.addEventListener(
                        "click",
                        () => {

                            selectLanguage(key);

                        }
                    );

                    DOM.languageTabs.appendChild(
                        button
                    );

                }
            );

        }


        // ==============================
        // SELECT LANGUAGE
        // ==============================

        function selectLanguage(language) {

            currentLanguage =
                language;

            DOM.output.textContent =
                "Output will appear here";

            DOM.output.classList.remove(
                "error"
            );

            updateLanguageButtons();

        }


        // ==============================
        // UPDATE ACTIVE LANGUAGE
        // ==============================

        function updateLanguageButtons() {

            const buttons =
                document.querySelectorAll(
                    ".lang-btn"
                );

            const languageKeys =
                Object.keys(languages);

            buttons.forEach(
                (button, index) => {

                    const key =
                        languageKeys[index];

                    button.classList.toggle(
                        "active",
                        key === currentLanguage
                    );

                }
            );

        }


        // ==============================
        // DEFAULT CODE
        // ==============================

        function setDefaultCode() {

            DOM.codeEditor.value =
                templates[currentLanguage];

        }


        // ==============================
        // RUN CODE
        // ==============================

        async function runCode() {

            const code =
                DOM.codeEditor.value.trim();

            if (!code) {

                showError(
                    "Please write some code first."
                );

                return;

            }

            DOM.runBtn.disabled = true;

            DOM.output.classList.remove(
                "error"
            );

            DOM.output.textContent =
                "Executing...";


            // HTML/CSS/JS PREVIEW

            if (
                currentLanguage === "html"
            ) {

                renderHTML();

                DOM.runBtn.disabled =
                    false;

                return;

            }


            // BACKEND EXECUTION

            await executeWithBackend();

        }


        // ==============================
        // HTML PREVIEW
        // ==============================

        function renderHTML() {

            const iframe =
                document.createElement(
                    "iframe"
                );

            DOM.output.innerHTML = "";

            DOM.output.appendChild(
                iframe
            );

            const documentObject =
                iframe.contentDocument ||
                iframe.contentWindow.document;

            documentObject.open();

            documentObject.write(
                DOM.codeEditor.value
            );

            documentObject.close();

        }


        // ==============================
        // BACKEND EXECUTION
        // ==============================

        async function executeWithBackend() {

            try {

                const response =
                    await fetch(
                        "/run",
                        {
                            method: "POST",

                            headers: {
                                "Content-Type":
                                    "application/json"
                            },

                            body:
                                JSON.stringify(
                                    {
                                        language:
                                            currentLanguage,

                                        sourceCode:
                                            DOM.codeEditor.value
                                    }
                                )
                        }
                    );


                const data =
                    await response.json();


                if (!response.ok) {

                    throw new Error(
                        data.error ||
                        data.output ||
                        `Server error: ${response.status}`
                    );

                }


                DOM.output.textContent =
                    data.output &&
                    data.output.trim() !== ""
                        ? data.output
                        : "Program executed successfully. No output.";


                if (data.success) {

                    DOM.output.classList.remove(
                        "error"
                    );

                } else {

                    DOM.output.classList.add(
                        "error"
                    );

                }

            }

            catch (error) {

                showError(
                    `Error: ${error.message}`
                );

            }

            finally {

                DOM.runBtn.disabled =
                    false;

            }

        }


        // ==============================
        // SHOW ERROR
        // ==============================

        function showError(message) {

            DOM.output.textContent =
                message;

            DOM.output.classList.add(
                "error"
            );

        }


        // ==============================
        // SAVE CODE
        // ==============================

        function saveCode() {

            const name =
                DOM.saveName.value.trim();

            if (!name) {

                alert(
                    "Please enter a name"
                );

                return;

            }

            const code = {

                id:
                    Date.now(),

                name:
                    name,

                language:
                    currentLanguage,

                code:
                    DOM.codeEditor.value,

                date:
                    new Date()
                        .toLocaleString()

            };


            savedCodes.push(code);


            localStorage.setItem(
                "shushuCompiledCodes",
                JSON.stringify(
                    savedCodes
                )
            );


            DOM.saveName.value =
                "";


            updateSavedCodesList();


            alert(
                "Code saved successfully!"
            );

        }


        // ==============================
        // LOAD SAVED CODE
        // ==============================

        function loadCode(id) {

            const code =
                savedCodes.find(
                    item =>
                        item.id === id
                );


            if (!code) {

                return;

            }


            currentLanguage =
                code.language;


            DOM.codeEditor.value =
                code.code;


            DOM.output.textContent =
                "Output will appear here";


            DOM.output.classList.remove(
                "error"
            );


            updateLanguageButtons();

        }


        // ==============================
        // DELETE CODE
        // ==============================

        function deleteCode(id) {

            savedCodes =
                savedCodes.filter(
                    code =>
                        code.id !== id
                );


            localStorage.setItem(
                "shushuCompiledCodes",
                JSON.stringify(
                    savedCodes
                )
            );


            updateSavedCodesList();

        }


        // ==============================
        // UPDATE SAVED LIST
        // ==============================

        function updateSavedCodesList() {

            if (
                savedCodes.length === 0
            ) {

                DOM.savedCodesCard.classList.add(
                    "hidden"
                );

                return;

            }


            DOM.savedCodesCard.classList.remove(
                "hidden"
            );


            DOM.saveCount.textContent =
                savedCodes.length;


            DOM.savedList.innerHTML =
                "";


            savedCodes.forEach(
                code => {

                    const item =
                        document.createElement(
                            "div"
                        );

                    item.className =
                        "saved-item";


                    const info =
                        document.createElement(
                            "div"
                        );

                    info.className =
                        "saved-item-info";


                    const nameButton =
                        document.createElement(
                            "button"
                        );

                    nameButton.className =
                        "saved-item-name";

                    nameButton.textContent =
                        code.name;


                    nameButton.addEventListener(
                        "click",
                        () => {

                            loadCode(
                                code.id
                            );

                        }
                    );


                    const language =
                        document.createElement(
                            "div"
                        );

                    language.className =
                        "saved-item-lang";

                    language.textContent =
                        languages[
                            code.language
                        ]?.name ||
                        code.language;


                    const deleteButton =
                        document.createElement(
                            "button"
                        );

                    deleteButton.className =
                        "delete-btn";

                    deleteButton.innerHTML =
                        `<i class="fas fa-trash"></i>`;


                    deleteButton.addEventListener(
                        "click",
                        () => {

                            deleteCode(
                                code.id
                            );

                        }
                    );


                    info.appendChild(
                        nameButton
                    );

                    info.appendChild(
                        language
                    );


                    item.appendChild(
                        info
                    );

                    item.appendChild(
                        deleteButton
                    );


                    DOM.savedList.appendChild(
                        item
                    );

                }
            );

        }


        // ==============================
        // DOWNLOAD CODE
        // ==============================

        function downloadCode() {

            const extensions = {

                html: "html",

                java: "java",

                csharp: "cs",

                python: "py",

                cpp: "cpp",

                c: "c",

                js: "js",

                php: "php",

                go: "go",

                rust: "rs",

                sql: "sql"

            };


            const extension =
                extensions[
                    currentLanguage
                ] || "txt";


            const blob =
                new Blob(
                    [
                        DOM.codeEditor.value
                    ],
                    {
                        type:
                            "text/plain"
                    }
                );


            const url =
                URL.createObjectURL(
                    blob
                );


            const link =
                document.createElement(
                    "a"
                );


            link.href =
                url;


            link.download =
                `shushu-code.${extension}`;


            document.body.appendChild(
                link
            );


            link.click();


            document.body.removeChild(
                link
            );


            URL.revokeObjectURL(
                url
            );

        }


        // ==============================
        // CLEAR CODE
        // ==============================

        function clearCode() {

            const confirmed =
                confirm(
                    "Clear all code?"
                );


            if (!confirmed) {

                return;

            }


            DOM.codeEditor.value =
                "";


            DOM.output.textContent =
                "Output will appear here";


            DOM.output.classList.remove(
                "error"
            );

        }


        // ==============================
        // INSERT TEMPLATE
        // ==============================

        function insertTemplate() {

            DOM.codeEditor.value =
                templates[
                    currentLanguage
                ] || "";


            DOM.output.textContent =
                "Output will appear here";


            DOM.output.classList.remove(
                "error"
            );

        }


        // ==============================
        // DARK MODE
        // ==============================

        function toggleDarkMode() {

            isDarkMode =
                !isDarkMode;


            document.body.classList.toggle(
                "dark-mode",
                isDarkMode
            );


            DOM.themeToggle.textContent =
                isDarkMode
                    ? "☀️"
                    : "🌙";


            localStorage.setItem(
                "shushuDarkMode",
                isDarkMode
            );

        }


        // ==============================
        // LOAD DARK MODE
        // ==============================

        function loadDarkMode() {

            isDarkMode =
                localStorage.getItem(
                    "shushuDarkMode"
                ) === "true";


            document.body.classList.toggle(
                "dark-mode",
                isDarkMode
            );


            DOM.themeToggle.textContent =
                isDarkMode
                    ? "☀️"
                    : "🌙";

        }


        // ==============================
        // LOAD SAVED CODES
        // ==============================

        function loadSavedCodes() {

            try {

                const saved =
                    localStorage.getItem(
                        "shushuCompiledCodes"
                    );


                if (saved) {

                    savedCodes =
                        JSON.parse(
                            saved
                        );

                    updateSavedCodesList();

                }

            }

            catch (error) {

                console.error(
                    "Could not load saved codes:",
                    error
                );

                savedCodes = [];

            }

        }


        // ==============================
        // EVENT LISTENERS
        // ==============================

        function attachEventListeners() {

            DOM.runBtn.addEventListener(
                "click",
                runCode
            );


            DOM.downloadBtn.addEventListener(
                "click",
                downloadCode
            );


            DOM.saveBtn.addEventListener(
                "click",
                saveCode
            );


            DOM.themeToggle.addEventListener(
                "click",
                toggleDarkMode
            );


            DOM.templateBtn.addEventListener(
                "click",
                insertTemplate
            );


            DOM.clearBtn.addEventListener(
                "click",
                clearCode
            );


            DOM.saveName.addEventListener(
                "keypress",
                function(event) {

                    if (
                        event.key === "Enter"
                    ) {

                        saveCode();

                    }

                }
            );

        }


        // ==============================
        // START APPLICATION
        // ==============================

        init();

    </script>

</body>
</html>
